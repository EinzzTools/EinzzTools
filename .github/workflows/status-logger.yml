name: Status Logger

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-endpoints:
    runs-on: ubuntu-latest
    env:
      API_USER: ${{ secrets.API_USER }}
      API_KEY: ${{ secrets.API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check endpoints with curl
        run: |
          set -u
          LOG_FILE="status.log"
          BASE="https://einzzcookie.org/v1"
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          echo "=== Status Check ($TIMESTAMP) ===" >> "$LOG_FILE"

          # run_check <feature> <path> [param=value ...]
          # Values are URL-encoded by curl (-G --data-urlencode), all requests are GET.
          run_check() {
            local feature="$1"
            local path="$2"
            shift 2

            local body
            body=$(mktemp)

            local curl_args=(
              -s -o "$body" -w "%{http_code}"
              --max-time 45
              -G
              -H "X-Email: $API_USER"
              -H "X-API-Key: $API_KEY"
              -H "X-Save-History: false"
            )

            local p
            for p in "$@"; do
              curl_args+=(--data-urlencode "$p")
            done

            local code rc=0
            code=$(curl "${curl_args[@]}" "$BASE/$path") || rc=$?
            if [ "$rc" -ne 0 ]; then
              code="ERR(curl exit $rc)"
            fi

            local params_display="${*:-none}"
            if [[ "$code" =~ ^2[0-9]{2}$ ]]; then
              echo "✅ $feature worked | Endpoint: GET /$path | Params: $params_display | Status: $code" | tee -a "$LOG_FILE"
            else
              local snippet
              snippet=$(head -c 200 "$body" | tr '\n' ' ')
              echo "❌ $feature did not work | Endpoint: GET /$path | Params: $params_display | Status: $code | Response: ${snippet:-empty}" | tee -a "$LOG_FILE"
            fi
            rm -f "$body"
          }

          # Other endpoints
          run_check "Post Links" "other/postLinks" "url=https://tiktok.com"
          run_check "Share Fake" "other/shareFake" "videoUrl=https://www.tiktok.com/@tiktok/video/1231231123"
          run_check "User QR Code" "other/userQrcode" "userId=2131123213123" "schemaType=4"

          # User endpoints
          run_check "User Info" "user/userInfo" "username=einzzcookie"
          run_check "User Info History" "user/userInfoHistory" "secUid=MS4wLjABAAAAv7iSuuXDJGDvJkmH_vz1qkDZYo1apxgzaxdBSeIuPiM"
          run_check "User Likes" "user/userLikes" "username=einzzcookie" "cursor=0"
          run_check "User Reposts" "user/userReposts" "username=tiktok" "cursor=0" "count=30"
          run_check "User Shared" "user/userShared" "url=https://www.tiktok.com/@dqarkveil?_r=1&_t=ZG-9BXZAxEPvZB"
          run_check "User Story" "user/userStory" "username=einzzcookie"

          # Video endpoints
          run_check "Video Comments" "video/videoComments" "url=https://www.tiktok.com/@cbsnews/video/7691452115373395214" "cursor=0"
          run_check "Video Downloader" "video/videoDownloader" "url=https://www.tiktok.com/@tiktok/video/7651659857640033566"
          run_check "Video Info" "video/info" "url=https://www.tiktok.com/@tiktok/video/7651659857640033566"
          run_check "Video Shared" "video/videoShared" "url=https://vm.tiktok.com/ZGdXH5VNA/"

          echo "" >> "$LOG_FILE"

      - name: Commit updated status.log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.log
          git diff --staged --quiet || git commit -m "Update status.log"
          git push
