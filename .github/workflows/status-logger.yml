name: API Status Logger

on:
  schedule:
    # Runs every 1 minute
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  log-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check API Status Code and Log
        run: |
          # Fetch the HTTP status code of the endpoint without any secret key
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://einzzcookie.org/api/check")
          
          # Get the current UTC timestamp
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S")
          
          # Check if status code is 409
          if [ "$STATUS_CODE" -eq 409 ]; then
            echo "[$TIMESTAMP] - All Endpoints Functionable" >> status.log
          else
            echo "[$TIMESTAMP] - Not All Endpoints Functionable (Code: $STATUS_CODE)" >> status.log
          fi

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update status.log [skip ci]"
          file_pattern: status.log.github/workflows/status-logger.yml
