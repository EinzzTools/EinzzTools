name: Status Logger

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-endpoints:
    runs-on: ubuntu-latest
    env:
      API_USER: ${{ secrets.API_USER }}
      API_KEY: ${{ secrets.API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check endpoints with curl
        run: |
          set -u
          LOG_FILE="status.log"
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          {
            echo "=== Status Check ($TIMESTAMP) ==="
          } >> "$LOG_FILE"

          run_check() {
            local feature="$1"
            local method="$2"
            local url="$3"
            local data="$4"

            local curl_args=(
              -s -o /dev/null -w "%{http_code}"
              --max-time 15
              -X "$method"
              -u "$API_USER:$API_KEY"
              -H "X-API-Key: $API_KEY"
              -H "Content-Type: application/json"
            )

            if [ -n "$data" ]; then
              curl_args+=(-d "$data")
            fi

            local code
            if ! code=$(curl "${curl_args[@]}" "$url"); then
              code="ERR"
            fi

            local data_display="${data:-none}"
            if [[ "$code" =~ ^2[0-9]{2}$ ]]; then
              echo "✅ $feature worked | Endpoint: $method $url | Data: $data_display | Status: $code" | tee -a "$LOG_FILE"
            else
              echo "❌ $feature did not work | Endpoint: $method $url | Data: $data_display | Status: $code" | tee -a "$LOG_FILE"
            fi
          }

          # Other endpoints
          run_check "Post Links" "POST" "https://example.com/api/other/post-links" '{"url":"https://example.com"}'
          run_check "Share Fake" "POST" "https://example.com/api/other/share-fake" '{"id":"123"}'
          run_check "User QR Code" "GET" "https://example.com/api/other/user-qr-code?username=demo" ""

          # User endpoints
          run_check "User Info" "GET" "https://example.com/api/user/info?username=einzzcookie" ""
          run_check "User Info History" "GET" "https://example.com/api/user/info-history?username=einzzcookie" ""
          run_check "User Likes" "GET" "https://example.com/api/user/likes?username=einzzcookie" ""
          run_check "User Reposts" "GET" "https://example.com/api/user/reposts?username=einzzcookie" ""
          run_check "User Shared" "GET" "https://example.com/api/user/shared?username=demo" ""
          run_check "User Story" "GET" "https://example.com/api/user/story?username=einzzcookie" ""

          # Video endpoints
          run_check "Video Comments" "GET" "https://example.com/api/video/comments?id=123" ""
          run_check "Video Downloader" "POST" "https://example.com/api/video/downloader" '{"id":"123"}'
          run_check "Video Info" "GET" "https://example.com/api/video/info?id=123" ""
          run_check "Video Shared" "POST" "https://example.com/api/video/shared" '{"id":"123"}'

          echo "" >> "$LOG_FILE"

      - name: Commit updated status.log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.log
          git diff --staged --quiet || git commit -m "Update status.log"
          git push
